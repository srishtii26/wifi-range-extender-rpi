# hostapd access point configuration
# Change the SSID and password before using this configuration.
interface=wlan1
driver=nl80211
ssid=RPi_WiFi_Extender
hw_mode=g
channel=6
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# WPA2-Personal configuration
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=ChangeThisPassword123
